<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#0a0e1a"/>
  <circle cx="96" cy="96" r="68" fill="none" stroke="#1e2a4a" stroke-width="1.5"/>
  <!-- ISS simplified shape -->
  <g transform="translate(96,96)" fill="#f7e04a">
    <!-- Main truss -->
    <rect x="-44" y="-5" width="88" height="10" rx="2"/>
    <!-- Solar panels left -->
    <rect x="-60" y="-24" width="20" height="40" rx="3" opacity=".9"/>
    <rect x="-60" y="-20" width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <rect x="-60" y="-12" width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <rect x="-60" y="-4"  width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <rect x="-60" y="4"   width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <rect x="-60" y="12"  width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <!-- Solar panels right -->
    <rect x="40" y="-24" width="20" height="40" rx="3" opacity=".9"/>
    <rect x="40" y="-20" width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <rect x="40" y="-12" width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <rect x="40" y="-4"  width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <rect x="40" y="4"   width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <rect x="40" y="12"  width="20" height="4" fill="#4a9eff" opacity=".7"/>
    <!-- Habitat modules -->
    <rect x="-18" y="-10" width="36" height="20" rx="4" fill="#c8d8ff"/>
  </g>
</svg>
